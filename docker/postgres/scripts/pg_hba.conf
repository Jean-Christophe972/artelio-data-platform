# Contrôle d'accès réseau à PostgreSQL (lu de haut en bas, la première règle qui correspond s'applique)
#
# TYPE     DATABASE      USER         ADDRESS   METHOD

# Socket Unix interne au conteneur : sert à l'initialisation et à l'administration
# via "docker exec" (qui exige déjà les droits root sur l'hôte).
local      all           all                    trust

# Réplication : uniquement le compte dédié, uniquement en TLS
hostssl    replication   replicator   all       scram-sha-256

# Toutes les autres connexions réseau : TLS + mot de passe haché (SCRAM-SHA-256)
hostssl    all           all          all       scram-sha-256

# Toute connexion réseau non chiffrée est refusée
host       all           all          all       reject
