# Règles d'alerte : chaque alerte a une sévérité et une description actionnable
groups:
  - name: disponibilite
    rules:
      - alert: ServiceIndisponible
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) ne répond plus"
          description: "Prometheus n'arrive plus à collecter les métriques depuis 1 minute."

      - alert: PostgresInjoignable
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL {{ $labels.role }} injoignable"
          description: "Si c'est le primaire : appliquer la procédure de bascule (scripts/failover_demo.sh)."

  - name: postgres
    rules:
      - alert: RetardDeReplication
        expr: pg_replication_lag_seconds{role="replica"} > 30
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Le réplica a {{ $value | humanizeDuration }} de retard"
          description: "En cas de bascule, les dernières écritures pourraient être perdues (RPO)."

      - alert: ConnexionsSaturees
        expr: sum by (role) (pg_stat_activity_count) / on(role) group_left max by (role) (pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 80 % des connexions PostgreSQL utilisées ({{ $labels.role }})"

  - name: sauvegardes
    rules:
      - alert: SauvegardeTropAncienne
        expr: time() - artelio_backup_last_success_timestamp_seconds > 7200
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Aucune sauvegarde réussie depuis plus de 2 h"
          description: "L'objectif de perte de données maximale (RPO 1 h) n'est plus garanti."

      - alert: SauvegardeEnEchec
        expr: artelio_backup_last_failure_timestamp_seconds > artelio_backup_last_success_timestamp_seconds
        labels: { severity: critical }
        annotations:
          summary: "La dernière sauvegarde a échoué"
          description: "Consulter les journaux : docker logs artelio-backup"

  - name: kafka
    rules:
      - alert: KafkaSansBroker
        expr: kafka_brokers < 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Aucun broker Kafka disponible : le flux temps réel est interrompu"

      - alert: RetardConsommateurKafka
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Le groupe {{ $labels.consumergroup }} a {{ $value }} messages de retard sur {{ $labels.topic }}"
